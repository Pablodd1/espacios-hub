<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <!-- Minimal dark-theme line illustration: open box + floating docs + sync arrow -->
  <g stroke="#2A3547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- open cardboard box -->
    <path d="M170 250 L240 282 L310 250 L310 300 L240 332 L170 300 Z"/>
    <path d="M170 250 L240 218 L310 250 L240 282 Z"/>
    <!-- box flaps -->
    <path d="M170 250 L132 236 L202 204 L240 218"/>
    <path d="M310 250 L348 236 L278 204 L240 218"/>
    <!-- inner shadow line -->
    <path d="M240 282 L240 332" stroke-opacity="0.6"/>
  </g>

  <!-- floating document sheets -->
  <g stroke="#2A3547" stroke-width="2" stroke-linejoin="round">
    <rect x="150" y="96" width="58" height="74" rx="6" transform="rotate(-8 150 96)"/>
    <rect x="218" y="70" width="58" height="74" rx="6"/>
    <rect x="288" y="100" width="58" height="74" rx="6" transform="rotate(7 288 100)"/>
  </g>
  <!-- doc text lines -->
  <g stroke="#2A3547" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M162 118 l36 -5 M164 132 l36 -5 M166 146 l24 -3"/>
    <path d="M232 92 h32 M232 106 h32 M232 120 h20"/>
    <path d="M300 124 l32 4 M298 138 l32 4 M296 152 l22 3"/>
  </g>
  <!-- emerald accent line on center doc -->
  <path d="M232 134 h32" stroke="#16C784" stroke-width="2.5" stroke-linecap="round"/>

  <!-- thin curved sync arrow connecting docs to box -->
  <path d="M247 156 C 247 196, 236 202, 236 236" stroke="#16C784" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <path d="M236 236 l-5 -9 M236 236 l7 -7" stroke="#16C784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
