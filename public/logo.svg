<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="eh-grad" x1="14" y1="82" x2="82" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16C784"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="eh-grad-face" x1="30" y1="60" x2="66" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16C784" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Sync arrows: two thin arcs chasing each other -->
  <path d="M78 34 A34 34 0 0 0 18 30" stroke="url(#eh-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 30 l-3.4 -6.4 M18 30 l6.6 -3.2" stroke="url(#eh-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 62 A34 34 0 0 0 78 66" stroke="url(#eh-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M78 66 l3.4 6.4 M78 66 l-6.6 3.2" stroke="url(#eh-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Isometric container: three interlocking parallelogram faces -->
  <!-- top face -->
  <path d="M48 26 L66 35.5 L48 45 L30 35.5 Z" fill="url(#eh-grad-face)" stroke="url(#eh-grad)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- left face -->
  <path d="M30 35.5 L48 45 L48 63 L30 53.5 Z" fill="url(#eh-grad-face)" fill-opacity="0.55" stroke="url(#eh-grad)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- right face -->
  <path d="M66 35.5 L48 45 L48 63 L66 53.5 Z" fill="url(#eh-grad-face)" fill-opacity="0.3" stroke="url(#eh-grad)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- corrugation hairlines -->
  <path d="M36 51 L36 40 M42 54 L42 42.5" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="0.9"/>
  <path d="M54 42.5 L54 54 M60 40 L60 51" stroke="#16C784" stroke-opacity="0.45" stroke-width="0.9"/>
</svg>
